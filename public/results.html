<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Results | C3 Data</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <img src="/c3-logo.png" alt="C3 Data Logo">
    <p class="tagline">Calibrate Capture Comply</p>
  </header>
  <div class="container">
    <h1>Overall Survey Results (Admin Only)</h1>

    <div id="login">
      <label for="password">Admin Password:</label><br>
      <input type="password" id="password" style="padding:0.5rem; width:100%; max-width:300px; margin:0.5rem 0;">
      <button class="primary" id="login-btn" style="max-width:200px;">Access Results</button>
      <div id="login-msg" class="message error" style="display:none;"></div>
    </div>

    <div id="results-wrapper" style="display:none;">
      <button class="refresh-btn" id="refresh">Refresh Results</button>
      <div id="results-content">Loading...</div>
      <p style="margin-top:2rem;"><a href="/">Back to Survey</a> | <a href="/admin.html">Owner Admin</a></p>
    </div>
  </div>
  <script>
    let token = localStorage.getItem('adminToken') || '';
    const loginDiv = document.getElementById('login');
    const resultsWrapper = document.getElementById('results-wrapper');

    function showResults() {
      loginDiv.style.display = 'none';
      resultsWrapper.style.display = 'block';
      loadResults();
    }

    if (token) showResults();

    document.getElementById('login-btn').addEventListener('click', async () => {
      const pw = document.getElementById('password').value;
      const msg = document.getElementById('login-msg');
      try {
        const res = await fetch('/api/results', {
          headers: { Authorization: 'Bearer ' + pw }
        });
        if (res.ok) {
          token = pw;
          localStorage.setItem('adminToken', token);
          showResults();
        } else {
          msg.textContent = 'Invalid password';
          msg.style.display = 'block';
        }
      } catch {
        msg.textContent = 'Error connecting';
        msg.style.display = 'block';
      }
    });

    async function loadResults() {
      const el = document.getElementById('results-content');
      el.textContent = 'Loading...';
      try {
        const res = await fetch('/api/results', {
          headers: { Authorization: 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        let html = `<p><strong>Total submissions:</strong> ${data.totalSubmissions}</p>`;
        for (const key of ['question1', 'question2']) {
          const q = data[key];
          html += `<h2>${q.title}</h2><table class="results-table"><thead><tr><th>Rank</th><th>Option</th><th>Total Points</th><th>Avg Rank</th><th>1st Place Votes</th></tr></thead><tbody>`;
          for (const r of q.results) {
            html += `<tr><td>${r.overallRank}</td><td>${q.options[r.optionIndex]}</td><td>${r.points}</td><td>${r.avgRank}</td><td>${r.firstPlace}</td></tr>`;
          }
          html += '</tbody></table>';
        }
        el.innerHTML = html;
      } catch (err) {
        el.innerHTML = '<div class="message error">Failed to load results. Check password or try again.</div>';
      }
    }

    document.getElementById('refresh').addEventListener('click', loadResults);
  </script>
</body>
</html>
